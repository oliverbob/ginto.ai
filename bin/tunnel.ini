; Ginto FRP client tunnel config (INI)
; Use this if you need proxy metadata like meta_ginto_key.
;
; Fill these in before running:
; - token: shared FRP auth token
; - meta_ginto_key: optional per-subdomain operator key (if enabled server-side)

[common]
server_addr = ginto.ai
server_port = 7000

authentication_method = token
token = PUT_YOUR_FRP_AUTH_TOKEN_HERE

tls_enable = true

[az-tunnel]
type = http
local_ip = 127.0.0.1
local_port = 8088
subdomain = az

; Optional operator key (server checks this if enabled for the subdomain)
meta_ginto_key = PUT_YOUR_TUNNEL_OPERATOR_KEY_HERE
