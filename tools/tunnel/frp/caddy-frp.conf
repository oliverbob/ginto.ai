# Caddy Configuration for FRP Virtual Host Integration
# 
# This configuration proxies *.ginto.ai subdomains to the frp vhost ports.
# Add this to your main Caddyfile.
#
# frps Configuration:
#   vhostHTTPPort = 8080
#   vhostHTTPSPort = 8443
#   subDomainHost = "ginto.ai"
#

# Wildcard subdomain handling for frp tunnels
# This catches all subdomains that aren't explicitly defined
*.ginto.ai {
    # TLS with on-demand certificates
    tls {
        on_demand
    }
    
    # Add real IP headers
    header_up X-Real-IP {remote_host}
    header_up X-Forwarded-For {remote_host}
    header_up X-Forwarded-Proto {scheme}
    
    # Proxy to frp vhost HTTP port
    reverse_proxy 127.0.0.1:8080 {
        # Pass the original Host header to frp
        header_up Host {host}
        
        # WebSocket support
        header_up Connection {>Connection}
        header_up Upgrade {>Upgrade}
        
        # Timeouts
        transport http {
            dial_timeout 10s
            response_header_timeout 60s
            read_timeout 120s
            write_timeout 120s
        }
        
        # Health check
        health_uri /
        health_interval 30s
        health_timeout 5s
        health_status 2xx 3xx 4xx
        
        # Retry on errors
        @retriable {
            expression {http.error} != nil && {http.error.status_code} >= 500
        }
        retry_on @retriable
        retry_interval 100ms
        max_retries 3
    }
    
    # Error handling
    handle_errors {
        respond "Tunnel not found or not responding" 502
    }
    
    # Logging
    log {
        output file /var/log/caddy/frp-tunnel.log {
            roll_size 100mb
            roll_keep 5
        }
    }
}

# Alternative: Direct HTTPS passthrough for frps HTTPS vhost
# Use this if you want frps to handle TLS termination
# *.ginto.ai:8443 {
#     reverse_proxy localhost:8443 {
#         transport http {
