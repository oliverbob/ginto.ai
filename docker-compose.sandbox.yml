# Ginto AI Docker Compose - Extended Sandbox Configuration
# 
# This file extends docker-compose.yml with additional sandbox options.
# Use when you need custom sandbox configurations.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
#
# This adds:
#   - Custom sandbox image builds
#   - Additional network isolation options
#   - Resource limits for sandboxes

services:
  # ==========================================================================
  # Sandbox Manager with extended permissions
  # ==========================================================================
  sandbox-manager:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    environment:
      - SANDBOX_CPU_LIMIT=${SANDBOX_CPU_LIMIT:-0.5}
      - SANDBOX_MEMORY_LIMIT=${SANDBOX_MEMORY_LIMIT:-256m}
      - SANDBOX_PIDS_LIMIT=${SANDBOX_PIDS_LIMIT:-100}
      - SANDBOX_NETWORK_EGRESS=${SANDBOX_NETWORK_EGRESS:-true}

  # ==========================================================================
  # Sandbox Base Image Builder
  # Builds the base image used for user sandboxes
  # ==========================================================================
  sandbox-builder:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    image: ginto-sandbox:latest
    container_name: ginto-sandbox-builder
    command: ["echo", "Sandbox base image built successfully"]
    profiles:
      - build

# ==========================================================================
# Additional Networks for advanced isolation
# ==========================================================================
networks:
  sandbox-isolated:
    name: ginto-sandbox-isolated
    driver: bridge
    internal: true  # No external internet access
    ipam:
      config:
        - subnet: 172.31.0.0/16
